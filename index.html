<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JOBS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="application-name" content="JOBS">
<meta name="theme-color" content="#171c18">
<meta name="format-detection" content="telephone=no">
<title>JOBS</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/app.css">
<script>
(function () {
  try {
    var t = localStorage.getItem("jobs-theme") || "system";
    if (t !== "light" && t !== "dark" && t !== "system") t = "system";
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) {
    document.documentElement.setAttribute("data-theme", "system");
  }
})();
</script>
</head>
<body>
<div class="app">
  <header id="topbar" class="topbar"></header>
  <main id="main" class="main"><p class="boot">Opening your records…</p></main>
  <nav id="tabbar" class="tabbar" aria-label="Main"></nav>
</div>
<div id="toast" class="toast" hidden role="status"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
