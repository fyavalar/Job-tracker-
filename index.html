<style>
:root{--bg:#f5f5f7;--card:#fff;--sub:#ececf0;--text:#111;--text2:#555;--text3:#888;--border:#d9d9de;--accent:#0a66d9;--accentSub:#e3eefc;--red:#d12c2c;--redSub:#fde8e8;--green:#1e8a3e;--greenSub:#e3f5e8;--amber:#a86200;--amberSub:#fdf1dc;--primary:#111;--onPrimary:#fff;--yellow:#ffd23f}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--sub:#2c2c2e;--text:#f2f2f2;--text2:#b0b0b5;--text3:#86868b;--border:#3a3a3c;--accent:#4c9bff;--accentSub:#14304f;--red:#ff6961;--redSub:#3d1515;--green:#4cd964;--greenSub:#123620;--amber:#ffb340;--amberSub:#3a2a0d;--primary:#ffd23f;--onPrimary:#111}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-size:16px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;border-bottom:1px solid var(--border)}
h1{margin:0 0 8px;font-size:24px;display:flex;align-items:center;gap:10px}
h1 img{width:30px;height:30px;border-radius:7px}
main{padding:12px 14px calc(env(safe-area-inset-bottom) + 30px);max-width:760px;margin:0 auto}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{flex:1 1 auto;min-height:44px;border:none;border-radius:12px;background:var(--sub);color:var(--text);font-size:14px;font-weight:600;font-family:inherit;padding:6px 9px;white-space:nowrap}
.tab.on{background:var(--primary);color:var(--onPrimary)}
button{font-family:inherit;cursor:pointer}
.btn{min-height:46px;padding:10px 16px;border-radius:12px;border:none;background:var(--sub);color:var(--text);font-size:16px;font-weight:600}
.btn.primary{background:var(--primary);color:var(--onPrimary)}
.btn.danger{background:var(--redSub);color:var(--red)}
.grow{flex:1 1 140px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.stat{flex:1 1 130px;border:1px solid var(--border);border-radius:14px;padding:10px 12px;background:var(--card)}
.stat .l{font-size:12px;font-weight:600;color:var(--text3);letter-spacing:.4px}
.stat .v{font-size:20px;font-weight:700}
.card{border:1px solid var(--border);border-left-width:6px;border-radius:14px;background:var(--card);padding:14px;margin-bottom:10px}
.c-attn{border-left-color:var(--red)}.c-prog{border-left-color:var(--accent)}.c-done{border-left-color:var(--green)}.c-{border-left-color:var(--border)}
.tap{cursor:pointer}
.between{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.name{font-size:18px;font-weight:700}
.amt{font-size:17px;font-weight:700}
.sub{color:var(--text2);font-size:14px;margin-top:2px}
.tiny{color:var(--text3);font-size:13px;margin-top:2px}
.pays{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pay{flex:1 1 140px;min-height:44px;padding:6px 12px;border-radius:12px;border:none;text-align:left}
.pay .l{font-size:12px;color:var(--text2)}.pay .v{font-size:15px;font-weight:700}
.pay.paid{background:var(--greenSub)}.pay.paid .v{color:var(--green)}
.pay.dep{background:var(--redSub)}.pay.dep .v{color:var(--red)}
.pay.bal{background:var(--amberSub)}.pay.bal .v{color:var(--amber)}
label.f{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:6px}
.fld{margin-bottom:14px}
input,textarea{width:100%;min-height:46px;padding:10px 12px;font-size:16px;font-family:inherit;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:10px;-webkit-appearance:none;appearance:none}
textarea{min-height:96px;resize:vertical}
input[type=file]{border:none;background:none;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:40px;padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;display:flex;align-items:center;gap:8px}
.chip.on{border:2px solid var(--accent);background:var(--accentSub)}
.dot{display:inline-block;width:12px;height:12px;border-radius:6px;background:var(--border)}
.d-attn{background:var(--red)}.d-prog{background:var(--accent)}.d-done{background:var(--green)}
.check{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:10px 12px;margin-bottom:10px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:16px;text-align:left}
.check.on{background:var(--greenSub)}
.box{width:24px;height:24px;border-radius:6px;border:2px solid var(--text3);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex:0 0 auto}
.check.on .box{background:var(--green);border-color:var(--green)}
.calc{background:var(--sub);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.calc div{display:flex;justify-content:space-between;color:var(--text2);font-size:14px;margin:3px 0}.calc b{color:var(--text)}
.err{color:var(--red);font-weight:600;margin-bottom:12px}
.warn{color:var(--amber);font-weight:600;font-size:14px;margin-bottom:8px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0 0;padding:6px 10px;border-radius:12px;background:var(--sub)}
.bar .msg{flex:1 1 160px;font-size:14px;color:var(--text2)}
.bar .btn{min-height:38px;padding:6px 12px;font-size:14px;background:var(--card)}
h2{font-size:22px;margin:0 0 14px}h3{font-size:18px;margin:16px 0 8px}
.month{flex:1 1 120px;text-align:center;font-size:20px;font-weight:700}
.strike{text-decoration:line-through}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px}
</style>
</head>

<main id="app"></main>
<script>
(function(){
"use strict";
var KEY="jobs-tracker-data-v1";
var COLORS=[["","No color"],["attn","Red - Needs attention"],["prog","Blue - In progress"],["done","Green - Completed / ready"]];
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function pad(n){return n<10?"0"+n:String(n);}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function monthOf(d){return d.slice(0,7);}
function num(s){var v=String(s||"").trim().replace(/[$,]/g,"");if(v==="")return null;var n=Number(v);return isFinite(n)?n:null;}
function validMoney(s,allowZero){var v=String(s||"").trim().replace(/[$,]/g,"");if(v==="")return true;if(!/^\d+(\.\d{1,2})?$/.test(v))return false;return allowZero?Number(v)>=0:Number(v)>0;}
function r2(n){return Math.round(n*100)/100;}
var fmt=new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"});
function money(n){return n===null||n===undefined?"":fmt.format(n);}
function deposit(j){var t=num(j.totalAmount);return t===null?null:r2(t*0.75);}
function balance(j){var t=num(j.totalAmount),d=deposit(j);return t===null||d===null?null:r2(t-d);}
function isSale(j){return j.color==="done"&&j.completed;}
function profit(j){var t=num(j.totalAmount),m=num(j.materialCost);return t===null||m===null?null:r2(t-m);}
function dayNum(d){var p=d.split("-").map(Number);return Date.UTC(p[0],p[1]-1,p[2])/86400000;}
function niceDate(d){if(!d)return "";var p=d.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});}
function niceMonth(m){var p=m.split("-").map(Number);return new Date(p[0],p[1]-1,1).toLocaleDateString("en-US",{month:"long",year:"numeric"});}
function shiftMonth(m,by){var p=m.split("-").map(Number);var d=new Date(p[0],p[1]-1+by,1);return d.getFullYear()+"-"+pad(d.getMonth()+1);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function str(o,k){var v=o[k];return typeof v==="string"?v:typeof v==="number"?String(v):"";}
function col(o,k){var v=o[k];if(v==="red")v="attn";if(v==="green")v="done";if(v==="blue")v="prog";return v==="attn"||v==="done"||v==="prog"?v:"";}
function normalize(x){
  if(!x||typeof x!=="object")throw new Error("bad");
  if(!Array.isArray(x.jobs)&&!Array.isArray(x.tasks))throw new Error("bad");
  var jobs=(x.jobs||[]).filter(function(j){return j&&typeof j==="object";}).map(function(r){return{
    id:str(r,"id")||uid(),customer:str(r,"customer"),address:str(r,"address"),phone:str(r,"phone"),email:str(r,"email"),
    sinks:str(r,"sinks"),material:str(r,"material"),totalSqft:str(r,"totalSqft"),materialCost:str(r,"materialCost"),totalAmount:str(r,"totalAmount"),
    depositPaid:r.depositPaid===true,balancePaid:r.balancePaid===true,templateDate:str(r,"templateDate"),installDate:str(r,"installDate"),
    statusText:str(r,"statusText"),color:col(r,"color"),notes:str(r,"notes"),completed:r.completed===true,salesDate:str(r,"salesDate")};});
  var tasks=(x.tasks||[]).filter(function(j){return j&&typeof j==="object";}).map(function(r){return{id:str(r,"id")||uid(),task:str(r,"task"),customer:str(r,"customer"),dueDate:str(r,"dueDate"),color:col(r,"color"),notes:str(r,"notes")};});
  return {version:1,jobs:jobs,tasks:tasks};
}
function blankJob(){return{id:uid(),customer:"",address:"",phone:"",email:"",sinks:"",material:"",totalSqft:"",materialCost:"",totalAmount:"",depositPaid:false,balancePaid:false,templateDate:"",installDate:"",statusText:"",color:"",notes:"",completed:false,salesDate:""};}
function blankTask(){return{id:uid(),task:"",customer:"",dueDate:"",color:"",notes:""};}

var storageOk=true, data;
try{var raw=localStorage.getItem(KEY);data=raw?normalize(JSON.parse(raw)):{version:1,jobs:[],tasks:[]};}catch(e){storageOk=false;data={version:1,jobs:[],tasks:[]};}
var S={tab:"jobs",editing:null,draft:null,error:"",armDelete:false,search:"",filter:"all",month:monthOf(todayStr()),flash:"",undo:null,backupText:"",importText:"",armImport:false};
var flashTimer=null;

function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));storageOk=true;}catch(e){storageOk=false;}}
function commit(next,label){S.undo={data:data,label:label};data=next;persist();setFlash(label);}
function setFlash(m){S.flash=m;clearTimeout(flashTimer);flashTimer=setTimeout(function(){S.flash="";renderBar();},2500);}
function doUndo(){if(!S.undo)return;data=S.undo.data;persist();setFlash("Undid: "+S.undo.label);S.undo=null;S.editing=null;render();}

function openJobs(){return data.jobs.filter(function(j){return !isSale(j);});}
function sales(){return data.jobs.filter(isSale);}
function unpaidItems(){var out=[];data.jobs.forEach(function(j){var d=deposit(j),b=balance(j);if(d!==null&&d>0&&!j.depositPaid)out.push({job:j,kind:"deposit",amt:d});if(b!==null&&b>0&&!j.balancePaid)out.push({job:j,kind:"balance",amt:b});});return out;}

function stat(l,v,cls){return '<div class="stat"><div class="l">'+esc(l)+'</div><div class="v"'+(cls?' style="color:var(--'+cls+')"':'')+'>'+esc(v)+'</div></div>';}
function payChip(kind,j){var amt=kind==="deposit"?deposit(j):balance(j);if(amt===null)return "";var paid=kind==="deposit"?j.depositPaid:j.balancePaid;
  return '<button class="pay '+(paid?"paid":kind==="deposit"?"dep":"bal")+'" data-act="pay" data-id="'+esc(j.id)+'" data-kind="'+kind+'"><div class="l">'+(kind==="deposit"?"75% deposit":"Remaining balance")+'</div><div class="v">'+esc(money(amt))+' · '+(paid?"PAID":"UNPAID")+'</div></button>';}
function pays(j){return num(j.totalAmount)!==null?'<div class="pays">'+payChip("deposit",j)+payChip("balance",j)+'</div>':"";}
function jobCard(j){
  var lines=[];if(j.templateDate)lines.push("Template "+niceDate(j.templateDate));if(j.installDate)lines.push("Install "+niceDate(j.installDate));
  var mat=[j.material,j.sinks?"Sinks: "+j.sinks:""].filter(Boolean).join(" · ");
  var stColor=j.color==="attn"?"red":j.color==="done"?"green":j.color==="prog"?"accent":"text2";
  return '<div class="card c-'+j.color+'"><div class="tap" data-act="editJob" data-id="'+esc(j.id)+'">'+
    '<div class="between"><div class="name">'+esc(j.customer)+'</div><div class="amt">'+esc(money(num(j.totalAmount)))+'</div></div>'+
    (j.statusText?'<div class="sub" style="font-weight:600;color:var(--'+stColor+')">'+esc(j.statusText)+'</div>':"")+
    (j.address?'<div class="sub">'+esc(j.address)+'</div>':"")+
    (mat?'<div class="tiny">'+esc(mat)+'</div>':"")+
    (lines.length?'<div class="tiny">'+esc(lines.join(" · "))+'</div>':"")+
    (j.completed&&!isSale(j)?'<div class="tiny">Completed, set status to green to move to Sales</div>':"")+
    '</div>'+pays(j)+'</div>';
}
function field(label,key,val,type,mode,ph,multi){
  return '<div class="fld"><label class="f">'+esc(label)+'</label>'+(multi?
    '<textarea data-field="'+key+'" rows="4"'+(ph?' placeholder="'+esc(ph)+'"':'')+'>'+esc(val)+'</textarea>':
    '<input data-field="'+key+'" type="'+(type||"text")+'"'+(mode?' inputmode="'+mode+'"':'')+(ph?' placeholder="'+esc(ph)+'"':'')+' value="'+esc(val)+'">')+'</div>';
}
function colorPicker(label,val){return '<div class="fld"><label class="f">'+esc(label)+'</label><div class="chips">'+COLORS.map(function(c){return '<button class="chip'+(val===c[0]?" on":"")+'" data-act="color" data-val="'+c[0]+'"><span class="dot d-'+c[0]+'"></span>'+esc(c[1])+'</button>';}).join("")+'</div></div>';}
function check(label,key,val){return '<button class="check'+(val?" on":"")+'" data-act="toggle" data-key="'+key+'"><span class="box">'+(val?"✓":"")+'</span>'+esc(label)+'</button>';}

function jobEditor(){
  var d=S.draft,isExisting=!!S.editing.id,today=todayStr();
  var wasSale=isExisting&&data.jobs.some(function(x){return x.id===d.id&&isSale(x);});
  var dep=deposit(d),bal=balance(d);
  return '<h2>'+(isExisting?"Edit customer job":"Add customer job")+'</h2>'+
    field("Customer name *","customer",d.customer)+field("Job address","address",d.address)+
    field("Phone","phone",d.phone,"tel","tel")+field("Email","email",d.email,"email","email")+
    field("Sinks (quantity, model, or details)","sinks",d.sinks)+field("Material","material",d.material)+
    field("Total sqft","totalSqft",d.totalSqft,"text","decimal")+
    field("Material cost (total for this job, not per sqft)","materialCost",d.materialCost,"text","decimal","Enter 0 if none")+
    field("Total amount (optional)","totalAmount",d.totalAmount,"text","decimal")+
    '<div class="calc"><div><span>75% deposit (automatic)</span><b id="calcDep">'+(dep===null?"-":esc(money(dep)))+'</b></div><div><span>Remaining balance (automatic)</span><b id="calcBal">'+(bal===null?"-":esc(money(bal)))+'</b></div></div>'+
    check("75% deposit PAID","depositPaid",d.depositPaid)+check("Remaining balance PAID","balancePaid",d.balancePaid)+
    field("Template date (optional)","templateDate",d.templateDate,"date")+field("Install date (optional)","installDate",d.installDate,"date")+
    field("Job status (your own text)","statusText",d.statusText,"text",null,"e.g. Waiting for sink delivery")+
    colorPicker("Job status color",d.color)+
    field("Notes","notes",d.notes,null,null,null,true)+
    check("Job completed","completed",d.completed)+
    '<div class="tiny" style="margin-bottom:14px">A job moves to Sales only when the status color is Green and Job completed is checked.</div>'+
    ((isSale(d)||d.salesDate)?field("Sales date (month used in Sales totals)","salesDate",d.salesDate,"date"):"")+
    (isSale(d)&&!d.salesDate?'<div class="tiny" style="margin:-8px 0 14px">Will be set to today ('+esc(niceDate(today))+') when you save.</div>':"")+
    (S.error?'<div class="err">'+esc(S.error)+'</div>':"")+
    '<div class="row"><button class="btn primary grow" data-act="saveJob">Save job</button><button class="btn grow" data-act="cancel">Cancel</button></div>'+
    (wasSale?'<div class="row"><button class="btn grow" data-act="reopen">Reopen job (move back to Jobs)</button></div>':"")+
    (isExisting?'<div class="row"><button class="btn danger grow" data-act="deleteJob">'+(S.armDelete?"Tap again to delete this job":"Delete job")+'</button></div>':"");
}
function taskEditor(){
  var d=S.draft,isExisting=!!S.editing.id;
  return '<h2>'+(isExisting?"Edit task":"Add task")+'</h2>'+
    field("Task *","task",d.task)+field("Customer / job (optional)","customer",d.customer)+field("Due date (optional)","dueDate",d.dueDate,"date")+
    colorPicker("Task status color",d.color)+field("Notes","notes",d.notes,null,null,null,true)+
    (S.error?'<div class="err">'+esc(S.error)+'</div>':"")+
    '<div class="row"><button class="btn primary grow" data-act="saveTask">Save task</button><button class="btn grow" data-act="cancel">Cancel</button></div>'+
    (isExisting?'<div class="row"><button class="btn danger grow" data-act="deleteTask">'+(S.armDelete?"Tap again to delete this task":"Delete task")+'</button></div>':"");
}
function jobsList(){
  var q=S.search.trim().toLowerCase(),oj=openJobs();
  var shown=oj.filter(function(j){if(S.filter!=="all"&&(S.filter==="none"?j.color!=="":j.color!==S.filter))return false;if(!q)return true;
    return [j.customer,j.address,j.phone,j.email,j.sinks,j.material,j.statusText,j.notes].join(" ").toLowerCase().indexOf(q)>=0;});
  return shown.map(jobCard).join("")+(oj.length?'<div class="tiny">Showing '+shown.length+' of '+oj.length+' jobs. Tap a job to edit; tap a payment to mark it paid or unpaid.</div>':"");
}
function viewJobs(){
  var oj=openJobs(),total=oj.reduce(function(s,j){return s+(num(j.totalAmount)||0);},0);
  var chips=[["all","All jobs"],["attn","Needs attention"],["prog","In progress"],["done","Green"],["none","No color"]];
  return '<div class="stats">'+stat("TOTAL JOBS",String(oj.length))+stat("NEEDS ATTENTION",String(oj.filter(function(j){return j.color==="attn";}).length),"red")+
    stat("COMPLETED",String(oj.filter(function(j){return j.completed||j.color==="done";}).length))+stat("TOTAL AMOUNT",money(total))+'</div>'+
    '<div class="row"><button class="btn primary grow" data-act="newJob">+ Add job</button></div>'+
    (oj.length?'<div style="margin-bottom:10px"><input id="search" placeholder="Search jobs" value="'+esc(S.search)+'" style="margin-bottom:8px"><div class="chips">'+
      chips.map(function(c){return '<button class="chip'+(S.filter===c[0]?" on":"")+'" data-act="filter" data-val="'+c[0]+'">'+c[1]+'</button>';}).join("")+'</div></div>':
      '<div class="sub" style="margin-bottom:10px">No open jobs. Tap + Add job to add one.</div>')+
    '<div id="jobList">'+jobsList()+'</div>';
}
function viewSales(){
  var today=todayStr(),sl=sales(),m=S.month;
  var ms=sl.filter(function(j){return monthOf(j.salesDate||today)===m;}).sort(function(a,b){return a.salesDate<b.salesDate?-1:1;});
  var months=Array.from(new Set(sl.map(function(j){return monthOf(j.salesDate||today);}))).sort().reverse();
  var tot=ms.reduce(function(s,j){return s+(num(j.totalAmount)||0);},0),mat=ms.reduce(function(s,j){return s+(num(j.materialCost)||0);},0);
  var known=ms.reduce(function(s,j){return s+(profit(j)||0);},0),missing=ms.filter(function(j){return profit(j)===null;}).length;
  return '<div class="row"><button class="btn" data-act="month" data-val="-1" aria-label="Previous month">‹</button><div class="month">'+esc(niceMonth(m))+'</div><button class="btn" data-act="month" data-val="1" aria-label="Next month">›</button></div>'+
    (months.length?'<div class="chips" style="margin-bottom:12px">'+months.map(function(x){return '<button class="chip'+(x===m?" on":"")+'" data-act="setMonth" data-val="'+x+'">'+esc(niceMonth(x))+'</button>';}).join("")+'</div>':"")+
    '<div class="stats" style="margin-bottom:6px">'+stat("COMPLETED SALES",String(ms.length))+stat("TOTAL SALES",money(tot))+stat("MATERIAL COST",money(mat))+stat(missing?"KNOWN PROFIT (INCOMPLETE)":"TOTAL PROFIT",money(known))+'</div>'+
    (missing?'<div class="warn">Incomplete: '+missing+' job(s) missing total or material cost.</div>':"")+
    '<div class="tiny" style="margin-bottom:12px">Totals are job value, not cash collected. Profit = sale minus material cost; excludes labor and other expenses.</div>'+
    (ms.length?"":'<div class="sub">No completed sales in '+esc(niceMonth(m))+'.</div>')+
    ms.map(function(j){var p=profit(j);return '<div class="card c-done"><div class="tap" data-act="editJob" data-id="'+esc(j.id)+'">'+
      '<div class="between"><div class="name">'+esc(j.customer)+'</div><div class="amt">'+esc(money(num(j.totalAmount)))+'</div></div>'+
      '<div class="tiny">Sales date '+esc(niceDate(j.salesDate||today))+(j.totalSqft?" · "+esc(j.totalSqft)+" sqft":"")+'</div>'+
      '<div class="sub" style="display:flex;flex-wrap:wrap;gap:16px;margin-top:6px"><span>Material: <b style="color:var(--text)">'+(j.materialCost?esc(money(num(j.materialCost))):"-")+'</b></span><span>Profit: <b style="color:var(--'+(p===null?"text3":p<0?"red":"text")+')">'+(p===null?"-":esc(money(p)))+'</b></span></div>'+
      (j.notes?'<div class="tiny">'+esc(j.notes)+'</div>':"")+'</div>'+pays(j)+'</div>';}).join("");
}
function viewUnpaid(){
  var items=unpaidItems(),total=items.reduce(function(s,u){return s+u.amt;},0),today=todayStr(),alerts=[];
  openJobs().forEach(function(j){if(j.completed)return;[["Template",j.templateDate],["Install",j.installDate]].forEach(function(p){if(!p[1])return;var diff=dayNum(p[1])-dayNum(today);if(diff>=0&&diff<=7)alerts.push({job:j,label:p[0],date:p[1],diff:diff});});});
  alerts.sort(function(a,b){return a.diff-b.diff;});
  return '<div class="stats">'+stat("UNPAID PAYMENTS",String(items.length))+stat("TOTAL UNPAID",money(total),items.length?"red":null)+'</div>'+
    (items.length?"":'<div class="sub" style="margin-bottom:12px">Nothing unpaid right now.</div>')+
    items.map(function(u){return '<div class="card c-" style="display:flex;flex-wrap:wrap;align-items:center;gap:10px"><div class="tap" style="flex:1 1 180px" data-act="editJob" data-id="'+esc(u.job.id)+'">'+
      '<div class="name" style="font-size:17px">'+esc(u.job.customer)+'</div><div class="sub" style="font-weight:600;color:var(--'+(u.kind==="deposit"?"red":"amber")+')">'+(u.kind==="deposit"?"75% deposit":"Remaining balance")+' · '+esc(money(u.amt))+'</div>'+
      (u.job.phone?'<div class="tiny">Phone: <a href="tel:'+esc(u.job.phone)+'" style="color:var(--accent)">'+esc(u.job.phone)+'</a></div>':"")+
      '</div><button class="btn primary" data-act="pay" data-id="'+esc(u.job.id)+'" data-kind="'+u.kind+'">Mark paid</button></div>';}).join("")+
    (alerts.length?'<h3>Template and install dates, next 7 days</h3>'+alerts.map(function(a){return '<div class="card c- tap" data-act="editJob" data-id="'+esc(a.job.id)+'"><div style="font-weight:700">'+a.label.toUpperCase()+' · '+esc(a.job.customer)+'</div><div class="sub">'+esc(niceDate(a.date))+' '+(a.diff===0?"(TODAY)":a.diff===7?"(IN ONE WEEK)":"(in "+a.diff+" day"+(a.diff===1?"":"s")+")")+'</div>'+(a.job.address?'<div class="tiny">'+esc(a.job.address)+'</div>':"")+'</div>';}).join(""):"");
}
function viewTasks(){
  var today=todayStr(),tasks=data.tasks.slice().sort(function(a,b){var ag=a.color==="done"?1:0,bg=b.color==="done"?1:0;if(ag!==bg)return ag-bg;return (a.dueDate||"9999-12-31")<(b.dueDate||"9999-12-31")?-1:1;});
  return '<div class="row"><button class="btn primary grow" data-act="newTask">+ Add task</button></div>'+
    (tasks.length?"":'<div class="sub">No tasks yet. Tap + Add task to get started.</div>')+
    tasks.map(function(k){return '<div class="card c-'+k.color+' tap" data-act="editTask" data-id="'+esc(k.id)+'"><div class="name'+(k.color==="done"?" strike":"")+'" style="font-size:17px">'+esc(k.task)+'</div>'+
      (k.customer?'<div class="sub">'+esc(k.customer)+'</div>':"")+(k.dueDate?'<div class="tiny"'+(k.color!=="done"&&k.dueDate<today?' style="color:var(--red)"':"")+'>Due '+esc(niceDate(k.dueDate))+'</div>':"")+
      (k.notes?'<div class="tiny">'+esc(k.notes)+'</div>':"")+'</div>';}).join("");
}
function viewBackup(){
  return '<h3 style="margin-top:0">Export backup</h3><div class="sub" style="margin-bottom:10px">Your records are saved on this phone only. Export a backup now and then, and keep it in Files, Notes, or email.</div>'+
    '<div class="row"><button class="btn primary grow" data-act="download">Download backup file</button><button class="btn grow" data-act="share">Share / copy backup</button></div>'+
    (S.backupText?'<textarea readonly class="mono" rows="6" style="margin-bottom:16px">'+esc(S.backupText)+'</textarea>':"")+
    '<h3>Import backup</h3><div class="sub" style="margin-bottom:10px">Choose a backup file or paste backup text. Importing replaces everything on this phone (Undo can reverse it). Backups from the JOBS Page work here too.</div>'+
    '<input type="file" id="file" accept="application/json,.json,text/plain" style="margin-bottom:10px">'+
    '<textarea id="importText" class="mono" rows="5" placeholder="Paste backup text here" style="margin-bottom:10px">'+esc(S.importText)+'</textarea>'+
    (S.error?'<div class="err">'+esc(S.error)+'</div>':"")+
    '<div id="importBtn">'+importBtn()+'</div>'+
    '<div class="tiny" style="margin-top:14px">'+data.jobs.length+' jobs ('+sales().length+' in Sales) and '+data.tasks.length+' tasks on this phone.</div>';
}
function importBtn(){return S.importText.trim()?'<div class="row"><button class="btn danger grow" data-act="import">'+(S.armImport?"Tap again to replace my data":"Replace my data with this backup")+'</button></div>':"";}

function renderTabs(){
  var u=unpaidItems().length,oj=openJobs().length,td=data.tasks.filter(function(k){return k.color!=="done";}).length;
  var t=[["jobs","Jobs",oj],["sales","Sales",0],["unpaid","Unpaid",u],["tasks","To Do",td],["backup","Backup",0]];
  document.getElementById("tabs").innerHTML=t.map(function(x){return '<button class="tab'+(S.tab===x[0]&&!S.editing?" on":"")+'" data-act="tab" data-val="'+x[0]+'">'+x[1]+(x[2]?" ("+x[2]+")":"")+'</button>';}).join("");
}
function renderBar(){
  var h="";
  if(S.undo||S.flash)h+='<div class="bar"><div class="msg">'+esc(S.flash||("Last change: "+(S.undo?S.undo.label:"")))+'</div>'+(S.undo?'<button class="btn" data-act="undo">Undo last change</button>':"")+'</div>';
  if(!storageOk)h+='<div class="warn" style="margin-top:6px">This browser isn\'t letting the app save. Use Backup to export your records before closing.</div>';
  document.getElementById("bar").innerHTML=h;
}
function render(){
  renderTabs();renderBar();
  var app=document.getElementById("app");
  if(S.editing&&S.editing.kind==="job")app.innerHTML=jobEditor();
  else if(S.editing&&S.editing.kind==="task")app.innerHTML=taskEditor();
  else app.innerHTML=({jobs:viewJobs,sales:viewSales,unpaid:viewUnpaid,tasks:viewTasks,backup:viewBackup})[S.tab]();
}

function togglePaid(id,kind){
  var j=data.jobs.find(function(x){return x.id===id;});if(!j)return;
  var now=kind==="deposit"?!j.depositPaid:!j.balancePaid;
  commit({version:1,tasks:data.tasks,jobs:data.jobs.map(function(x){if(x.id!==id)return x;var c=Object.assign({},x);if(kind==="deposit")c.depositPaid=now;else c.balancePaid=now;return c;})},(kind==="deposit"?"Deposit":"Balance")+" marked "+(now?"PAID":"UNPAID")+" for "+j.customer);
  render();
}
function openEditor(kind,id){
  var src=kind==="job"?data.jobs:data.tasks,x=id?src.find(function(y){return y.id===id;}):null;
  S.draft=x?Object.assign({},x):(kind==="job"?blankJob():blankTask());S.editing={kind:kind,id:id||null};S.error="";S.armDelete=false;render();window.scrollTo(0,0);
}
function saveJob(){
  var d=S.draft,today=todayStr();
  if(!d.customer.trim()){S.error="Enter a customer name.";return render();}
  if(!validMoney(d.totalAmount,false)){S.error="Enter a positive total amount with up to two decimal places, or leave it blank.";return render();}
  if(!validMoney(d.totalSqft,true)||!validMoney(d.materialCost,true)){S.error="Enter zero or positive sqft/material cost, with up to two decimal places.";return render();}
  if(d.templateDate&&d.installDate&&d.installDate<d.templateDate){S.error="Install date must be on or after template date.";return render();}
  var saved=Object.assign({},d,{customer:d.customer.trim()});if(isSale(saved)&&!saved.salesDate)saved.salesDate=today;
  var exists=data.jobs.some(function(x){return x.id===saved.id;});
  var jobs=exists?data.jobs.map(function(x){return x.id===saved.id?saved:x;}):[saved].concat(data.jobs);
  commit({version:1,tasks:data.tasks,jobs:jobs},(exists?"Saved ":"Added ")+saved.customer+(isSale(saved)?" (moved to Sales)":""));
  S.editing=null;render();
}
function saveTask(){
  var d=S.draft;if(!d.task.trim()){S.error="Enter a task description.";return render();}
  var saved=Object.assign({},d,{task:d.task.trim()}),exists=data.tasks.some(function(x){return x.id===saved.id;});
  commit({version:1,jobs:data.jobs,tasks:exists?data.tasks.map(function(x){return x.id===saved.id?saved:x;}):[saved].concat(data.tasks)},exists?"Saved task":"Added task");
  S.editing=null;render();
}
function backupJson(){return JSON.stringify(Object.assign({},data,{exportedAt:new Date().toISOString(),app:"JOBS phone tracker"}),null,2);}
function doImport(text){
  try{var next=normalize(JSON.parse(text));commit(next,"Imported "+next.jobs.length+" jobs and "+next.tasks.length+" tasks");S.importText="";S.armImport=false;S.error="";}
  catch(e){S.error="That doesn't look like a JOBS backup file.";S.armImport=false;}
  render();
}

document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");if(!el)return;
  var act=el.getAttribute("data-act"),id=el.getAttribute("data-id"),val=el.getAttribute("data-val");
  if(act==="pay"){e.stopPropagation();togglePaid(id,el.getAttribute("data-kind"));return;}
  switch(act){
    case "tab":S.tab=val;S.editing=null;S.error="";render();window.scrollTo(0,0);break;
    case "undo":doUndo();break;
    case "newJob":openEditor("job",null);break;
    case "editJob":openEditor("job",id);break;
    case "newTask":openEditor("task",null);break;
    case "editTask":openEditor("task",id);break;
    case "cancel":S.editing=null;S.error="";render();break;
    case "color":S.draft.color=val;render();break;
    case "toggle":var k=el.getAttribute("data-key");S.draft[k]=!S.draft[k];render();break;
    case "saveJob":saveJob();break;
    case "saveTask":saveTask();break;
    case "deleteJob":if(!S.armDelete){S.armDelete=true;render();break;}commit({version:1,tasks:data.tasks,jobs:data.jobs.filter(function(x){return x.id!==S.draft.id;})},"Deleted job for "+(S.draft.customer||"customer"));S.editing=null;render();break;
    case "deleteTask":if(!S.armDelete){S.armDelete=true;render();break;}commit({version:1,jobs:data.jobs,tasks:data.tasks.filter(function(x){return x.id!==S.draft.id;})},"Deleted task");S.editing=null;render();break;
    case "reopen":var re=Object.assign({},S.draft,{completed:false});commit({version:1,tasks:data.tasks,jobs:data.jobs.map(function(x){return x.id===re.id?re:x;})},"Reopened "+re.customer+" (back in Jobs)");S.editing=null;S.tab="jobs";render();break;
    case "filter":S.filter=val;render();break;
    case "month":S.month=shiftMonth(S.month,Number(val));render();break;
    case "setMonth":S.month=val;render();break;
    case "download":
      S.backupText=backupJson();
      try{var blob=new Blob([S.backupText],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="jobs-backup-"+todayStr()+".json";document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);setFlash("Backup file created. If nothing appeared, use Share / copy.");}catch(err){setFlash("Copy the backup text below.");}
      render();break;
    case "share":
      S.backupText=backupJson();render();
      var txt=S.backupText;
      if(navigator.share){navigator.share({title:"JOBS backup "+todayStr(),text:txt}).catch(function(){});}
      else if(navigator.clipboard){navigator.clipboard.writeText(txt).then(function(){setFlash("Backup copied");renderBar();},function(){setFlash("Select the text below and copy it");renderBar();});}
      break;
    case "import":if(!S.armImport){S.armImport=true;document.getElementById("importBtn").innerHTML=importBtn();break;}doImport(S.importText);break;
  }
});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="search"){S.search=t.value;document.getElementById("jobList").innerHTML=jobsList();return;}
  if(t.id==="importText"){S.importText=t.value;S.armImport=false;document.getElementById("importBtn").innerHTML=importBtn();return;}
  var f=t.getAttribute&&t.getAttribute("data-field");
  if(f&&S.draft){S.draft[f]=t.value;
    if(f==="totalAmount"){var dep=deposit(S.draft),bal=balance(S.draft);document.getElementById("calcDep").textContent=dep===null?"-":money(dep);document.getElementById("calcBal").textContent=bal===null?"-":money(bal);}
  }
});
document.addEventListener("change",function(e){
  var t=e.target;if(t.id!=="file"||!t.files||!t.files[0])return;
  var r=new FileReader();r.onload=function(){S.importText=typeof r.result==="string"?r.result:"";S.armImport=false;setFlash("File loaded. Tap Replace my data to import it.");render();};r.readAsText(t.files[0]);t.value="";
});
window.addEventListener("storage",function(e){if(e.key===KEY&&e.newValue){try{data=normalize(JSON.parse(e.newValue));render();}catch(err){}}});

render();
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(function(){});}
window.__jobs={get data(){return data;}};
})();
</script>
</body>
</html>
